name: ScienceKeyboard
options:
  bundleIdPrefix: com.adrianpol
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Change this to your own reverse-DNS prefix before signing.
    BUNDLE_ID_PREFIX: com.adrianpol
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  ScienceKeyboard:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: ScienceKeyboard
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).ScienceKeyboard
        INFOPLIST_FILE: Config/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/App.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: Keyboard
    scheme: {}
  Keyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: Keyboard
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).ScienceKeyboard.Keyboard
        INFOPLIST_FILE: Config/Keyboard-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Keyboard.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
