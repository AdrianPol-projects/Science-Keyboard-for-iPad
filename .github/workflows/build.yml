name: Build iOS app

on:
  push:
    paths-ignore:
      - 'Notes/**'
      - '.github/workflows/notes.yml'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set +e
          xcodebuild \
            -project ScienceKeyboard.xcodeproj \
            -scheme ScienceKeyboard \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          status=$?
          echo "::group::Compiler errors"
          grep -E "error:" build.log | sort -u | head -200
          echo "::endgroup::"
          echo "::group::Warnings"
          grep -E "warning:" build.log | sort -u | head -100
          echo "::endgroup::"
          tail -n 30 build.log
          exit $status

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ScienceKeyboard.app Payload/
          ls -la Payload/ScienceKeyboard.app/PlugIns
          zip -qry ScienceKeyboard-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ScienceKeyboard-unsigned
          path: ScienceKeyboard-unsigned.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      # ---------------------------------------------------------------
      # Optional: sign with your own certificate + provisioning profiles.
      # Runs only when the BUILD_CERTIFICATE_BASE64 secret exists.
      # See README → "Signed builds in CI".
      # ---------------------------------------------------------------
      - name: Check for signing secrets
        id: signing
        env:
          CERT: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        run: |
          if [ -n "$CERT" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; fi

      - name: Rebuild with your bundle ID prefix
        if: steps.signing.outputs.enabled == 'true'
        env:
          BUNDLE_ID_PREFIX: ${{ secrets.BUNDLE_ID_PREFIX }}
        run: |
          rm -rf build Payload
          xcodebuild \
            -project ScienceKeyboard.xcodeproj \
            -scheme ScienceKeyboard \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            BUNDLE_ID_PREFIX="$BUNDLE_ID_PREFIX" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build-signed.log 2>&1 || { grep -E "error:" build-signed.log | head -100; exit 1; }
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ScienceKeyboard.app Payload/

      - name: Sign
        if: steps.signing.outputs.enabled == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APP_PROFILE_BASE64: ${{ secrets.APP_PROFILE_BASE64 }}
          KEYBOARD_PROFILE_BASE64: ${{ secrets.KEYBOARD_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/signing"
          mkdir -p "$WORK"
          KEYCHAIN="$WORK/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$WORK/cert.p12"
          echo "$APP_PROFILE_BASE64" | base64 --decode > "$WORK/app.mobileprovision"
          echo "$KEYBOARD_PROFILE_BASE64" | base64 --decode > "$WORK/keyboard.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$WORK/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | head -1 | awk '{print $2}')
          echo "Signing identity: $IDENTITY"

          for name in app keyboard; do
            security cms -D -i "$WORK/$name.mobileprovision" > "$WORK/$name-profile.plist"
            /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' "$WORK/$name-profile.plist" > "$WORK/$name-entitlements.plist"
          done

          APP=Payload/ScienceKeyboard.app
          EXT="$APP/PlugIns/Keyboard.appex"
          cp "$WORK/keyboard.mobileprovision" "$EXT/embedded.mobileprovision"
          cp "$WORK/app.mobileprovision" "$APP/embedded.mobileprovision"
          codesign --force --sign "$IDENTITY" --entitlements "$WORK/keyboard-entitlements.plist" --keychain "$KEYCHAIN" "$EXT"
          codesign --force --sign "$IDENTITY" --entitlements "$WORK/app-entitlements.plist" --keychain "$KEYCHAIN" "$APP"
          codesign --verify --deep --strict "$APP"
          zip -qry ScienceKeyboard-signed.ipa Payload

      - name: Upload signed IPA
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ScienceKeyboard-signed
          path: ScienceKeyboard-signed.ipa
